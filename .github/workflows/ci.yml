name: CI

on:
  push:
    branches: [main]
  pull_request:

# Отменяем устаревшие запуски для той же ветки/PR, чтобы не жечь раннеры.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django_server
    env:
      # Тесты идут на SQLite и без реального Firebase/Google — никаких секретов не нужно.
      DJANGO_ENV: local
      DJANGO_DEBUG: "0"
      FIREBASE_AUTH_ENABLED: "0"
      DJANGO_SECRET_KEY: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: django_server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (freezed / riverpod / drift / json)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
