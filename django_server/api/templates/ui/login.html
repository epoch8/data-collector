{% extends "ui/base.html" %}
{% block title %}Вход{% endblock %}
{% block body_class %}ui-auth-body{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-11 col-sm-8 col-md-5 col-lg-4">
    <div class="card p-4 login-form-card">
      <h1 class="h5 mb-3 text-white">Вход</h1>
      <form method="post" action="">
        {% csrf_token %}
        {% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Войти</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
