{% load i18n %}
<button type="button" class="ui-theme-toggle" id="uiThemeToggle"
        aria-label="{% trans 'Переключить тему' %}" title="{% trans 'Светлая / тёмная тема' %}">
  <i class="bi bi-moon-stars-fill ui-theme-toggle__moon" aria-hidden="true"></i>
  <i class="bi bi-brightness-high-fill ui-theme-toggle__sun" aria-hidden="true"></i>
</button>
