<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Data Collector — админка{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0f1419; color: #f0f6fc; }
    .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
    .card { background: #161b22; border-color: #30363d; color: #f0f6fc; }
    .form-control, .form-select { background: #010409; border-color: #484f58; color: #f0f6fc; }
    .form-control:focus { background: #010409; color: #f0f6fc; border-color: #58a6ff; box-shadow: 0 0 0 0.2rem rgba(88, 166, 255, 0.25); }
    textarea.form-control { font-family: ui-monospace, monospace; font-size: 13px; }
    a { color: #79c0ff; }
    .table { --bs-table-bg: transparent; --bs-table-color: #f0f6fc; border-color: #30363d; }
    .table thead th { border-color: #30363d; color: #c9d1d9; }
    .btn-primary { background: #238636; border-color: #238636; }
    .btn-primary:hover { background: #2ea043; border-color: #2ea043; }
    .btn-outline-danger { color: #f85149; border-color: #f85149; }
    .btn-outline-danger:hover { background: #f85149; color: #fff; }
    .text-muted { color: #b1bac4 !important; }
    code { color: #79c0ff; }
    /* JSON / манифест */
    pre.json-block, textarea.json-block {
      background: #010409;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem;
    }
    pre.json-block { font-size: 13px; line-height: 1.45; }
    /* Форма входа (Django рендерит {{ form.as_p }}) */
    .login-form-card label,
    .login-form-card p { color: #f0f6fc !important; }
    .login-form-card p { margin-bottom: 0.75rem; }
    .login-form-card input[type="text"],
    .login-form-card input[type="password"] {
      width: 100%;
      background: #010409 !important;
      color: #f0f6fc !important;
      border: 1px solid #484f58 !important;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin-top: 0.25rem;
    }
    .login-form-card .errorlist { color: #ff7b72; list-style: none; padding-left: 0; margin: 0.25rem 0 0; font-size: 0.875rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Data Collector</span>
    <div class="d-flex gap-3 align-items-center">
      {% if user.is_authenticated %}
        <a class="text-decoration-none" href="{% url 'ui_project_list' %}">Проекты</a>
        <a class="text-decoration-none" href="{% url 'ui_package_list' %}">Пакеты</a>
        <span class="text-muted small">{{ user.username }}</span>
        <a class="btn btn-sm btn-outline-light" href="{% url 'ui_logout' %}">Выход</a>
      {% else %}
        <a class="btn btn-sm btn-outline-light" href="{% url 'ui_login' %}">Вход</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% if messages %}
    {% for m in messages %}
      <div class="alert {% if m.tags == 'error' %}alert-danger{% elif m.tags == 'success' %}alert-success{% else %}alert-secondary{% endif %} border-secondary mb-2" role="alert">{{ m }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
