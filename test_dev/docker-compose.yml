# Локальная имитация прод-хранилищ для data-collector:
#   - PostgreSQL  (project DB: database_uri)
#   - MinIO (S3)  (blobs пакетов: storage_uri)
#
# Поднять:   docker compose -f test_dev/docker-compose.yml up -d
# Погасить:  docker compose -f test_dev/docker-compose.yml down
# Снести с данными: docker compose -f test_dev/docker-compose.yml down -v
#
# После старта подставьте URI в проект (UI «Изменить хранилище») — см. test_dev/README.md.

name: data-collector-testdev

services:
  postgres:
    image: postgres:16-alpine
    container_name: dc-testdev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-collector}
      POSTGRES_PASSWORD: ${PGPASSWORD:-collector}
      POSTGRES_DB: ${PGDATABASE:-collector}
    ports:
      - "${PGPORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-collector}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dc-testdev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Приёмочный сервис: принимает on_commit-webhook из django_server и логирует его.
  # См. django_server/api/package_callback_service.py и секцию config.on_commit в конфиге проекта.
  acceptance:
    build: ./acceptance
    container_name: dc-testdev-acceptance
    restart: unless-stopped
    environment:
      ACCEPTANCE_PORT: 8080
    ports:
      - "${ACCEPTANCE_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовый init: создаёт стартовый бакет(ы) в MinIO.
  minio-init:
    image: minio/mc:latest
    container_name: dc-testdev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${INIT_BUCKET:-dc-packages} &&
      echo 'bucket ready: ${INIT_BUCKET:-dc-packages}'
      "

volumes:
  pgdata:
  miniodata:
